[General]

; 1 = lower the weapon by itself when you stop using it.
; 0 = never lower it on its own, only with iToggleKey below.
bAutoLower = 1

; Seconds to wait before the weapon is lowered.
fLowerDelay = 3.0

; 1 = lower the weapon the moment you stop sprinting instead of waiting fLowerDelay.
bLowerAfterSprint = 0

; 1 = keep the weapon raised while the pip-boy light or weapon flashlight is on.
bRequireLightOff = 0

; Key for lowring or rasing the weapon instantly, ignoring fLowerDelay.
; Windows virtual-key code.
; Letters: A=65 B=66 C=67 D=68 E=69 F=70 G=71 H=72 I=73 J=74 K=75 L=76 M=77
;          N=78 O=79 P=80 Q=81 R=82 S=83 T=84 U=85 V=86 W=87 X=88 Y=89 Z=90
; F keys:  F1=112 F2=113 F3=114 F4=115 F5=116 F6=117 ... F12=123
; Other:   Tab=9  CapsLock=20  Space=32  Insert=45  Delete=46
;          Numpad 0-9 = 96-105
iToggleKey = -1

; 1 = log every animation event and key press the plugin sees. Turn this on if a
; weapon refuses to lower, or to find the code of the key you want to bind above.
; It writes a lot.
bDebugLog = 0